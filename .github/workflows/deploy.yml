name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # VITE_UPGRADE_URL is intentionally unset: no real checkout link has
      # been supplied yet, so the app shows "checkout not configured" in
      # production. Add it here (or as a repo variable) when going live.
      # Never put private payment credentials in VITE_* variables — they
      # are baked into the public bundle.
      - run: npm run build
      - uses: actions/configure-pages@v4
        with:
          # Auto-enable Pages on the repo (source: GitHub Actions) using
          # the workflow's GITHUB_TOKEN pages:write permission.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
